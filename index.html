<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trade Center</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- ── Mode Selection ── -->
  <div id="mode-screen" class="screen active">
    <div class="card">
      <div class="mode-logo">🏙️</div>
      <h1>Trade Center</h1>
      <p class="sub">Jogo de Tabuleiro</p>
      <div class="mode-btns">
        <button class="mode-btn" id="btn-local">
          <span class="mode-icon">🖥️</span>
          <span class="mode-text">
            <span class="mode-label">Local</span>
            <span class="mode-desc">2–4 jogadores na mesma tela, turnos alternados</span>
          </span>
        </button>
        <button class="mode-btn" id="btn-online">
          <span class="mode-icon">🌐</span>
          <span class="mode-text">
            <span class="mode-label">Online (Coop)</span>
            <span class="mode-desc">Jogue com amigos em máquinas diferentes via sala</span>
          </span>
        </button>
      </div>
    </div>
  </div>

  <!-- ── Local Setup ── -->
  <div id="setup-screen" class="screen">
    <div class="card">
      <h1>Jogo Local</h1>
      <p class="sub">Configure os jogadores</p>

      <div class="form-group">
        <label>Número de Jogadores</label>
        <div class="player-count-btns">
          <button class="count-btn active" data-count="2">2</button>
          <button class="count-btn" data-count="3">3</button>
          <button class="count-btn" data-count="4">4</button>
        </div>
      </div>

      <div class="form-group">
        <label>Nomes</label>
        <div id="player-names-section"></div>
      </div>

      <button id="start-local-btn" class="btn-primary">▶ Começar</button>
      <button id="back-to-mode-from-setup" class="btn-secondary">← Voltar</button>
    </div>
  </div>

  <!-- ── Online Config ── -->
  <div id="online-screen" class="screen">
    <div class="card">
      <h1>🌐 Online</h1>
      <p class="sub">Configure a conexão</p>

      <div class="online-section">
        <label>Seu Nome</label>
        <input id="online-name" type="text" placeholder="Seu apelido" maxlength="20">
      </div>

      <div class="online-section">
        <label>URL do Servidor WebSocket</label>
        <input id="ws-url" type="text" placeholder="ws://localhost:8080">
      </div>

      <button id="btn-create-room" class="btn-primary">🏠 Criar Sala</button>

      <div class="divider">ou entre em uma sala existente</div>

      <div class="join-row">
        <input id="room-code-input" type="text" placeholder="Código da sala (ex: A1B2C3)" maxlength="6" style="text-transform:uppercase">
        <button id="btn-join-room" class="btn-primary">Entrar</button>
      </div>

      <p id="online-status" class="online-status"></p>
      <button id="back-to-mode-from-online" class="btn-secondary">← Voltar</button>
    </div>
  </div>

  <!-- ── Lobby ── -->
  <div id="lobby-screen" class="screen">
    <div class="card lobby-card">
      <div class="lobby-header">
        <h1>🏠 Sala</h1>
        <div class="room-code-display">
          <span id="display-room-code">------</span>
          <button id="copy-code-btn">Copiar</button>
        </div>
      </div>

      <div id="lobby-player-list"></div>
      <p id="lobby-hint" class="lobby-hint"></p>
      <button id="lobby-ready-btn" class="btn-ready-main" style="display:none">Marcar como Pronto</button>
      <button id="back-to-mode-from-lobby" class="btn-leave">← Sair da Sala</button>
    </div>

    <!-- Countdown overlay -->
    <div id="lobby-countdown">
      <div class="cd-ring">
        <span id="cd-number">5</span>
      </div>
      <p>Jogo iniciando...</p>
      <button id="btn-cancel-ready">✕ Cancelar Pronto</button>
    </div>
  </div>

  <!-- ── Game ── -->
  <div id="game-screen" class="screen">
    <div id="game-container">

      <div id="board-wrapper">
        <div id="board"></div>
        <div id="legend">
          <div class="legend-item"><span class="leg-color" style="background:#112050;border-color:#1e3a80"></span> Normal</div>
          <div class="legend-item"><span class="leg-color" style="background:#0e4a28;border-color:#27ae60"></span> Bônus</div>
          <div class="legend-item"><span class="leg-color" style="background:#4a0e0e;border-color:#c0392b"></span> Penalidade</div>
          <div class="legend-item"><span class="leg-color" style="background:#30104a;border-color:#8e44ad"></span> Teleporte</div>
          <div class="legend-item"><span class="leg-color" style="background:#4a3a0e;border-color:#d68910"></span> Perde a vez</div>
          <div class="legend-item"><span class="leg-color" style="background:#0e3a4a;border-color:#17a589"></span> Role de novo</div>
        </div>
      </div>

      <div id="sidebar">
        <h2 class="sidebar-title">🏙️ Trade Center</h2>

        <div id="players-panel"></div>

        <div id="dice-area">
          <div id="dice">
            <div class="dice-dot-grid">
              <span></span><span></span><span></span>
              <span></span><span></span><span></span>
              <span></span><span></span><span></span>
            </div>
          </div>
          <button id="roll-btn" class="btn-primary">🎲 Rolar Dado</button>
        </div>

        <div id="log-area">
          <h3>Eventos</h3>
          <div id="game-log"></div>
        </div>
      </div>

    </div>
  </div>

  <!-- ── Win ── -->
  <div id="win-screen" class="screen">
    <div class="card">
      <div class="trophy">🏆</div>
      <h1>Missão Cumprida!</h1>
      <p id="winner-text"></p>
      <button id="play-again-btn" class="btn-primary">↩ Menu Principal</button>
    </div>
  </div>

  <!-- ── Roll Overlay ── -->
  <div id="roll-overlay">
    <div class="roll-card">
      <div class="roc-header">
        <div class="roc-avatar" id="roc-avatar">J</div>
        <span class="roc-player-name" id="roc-player-name">Jogador</span>
      </div>
      <div id="roc-dice">
        <div class="dice-dot-grid">
          <span></span><span></span><span></span>
          <span></span><span></span><span></span>
          <span></span><span></span><span></span>
        </div>
      </div>
      <div class="roc-result" id="roc-result">
        <div class="roc-value" id="roc-value"></div>
        <div class="roc-event-box" id="roc-event-box" style="display:none">
          <span id="roc-event-text"></span>
        </div>
      </div>
      <button class="btn-primary roc-btn" id="roc-continue" style="display:none">Continuar →</button>
    </div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/board.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/network.js"></script>
  <script src="js/game.js"></script>
</body>
</html>
